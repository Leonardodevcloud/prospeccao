; Ponte do WhatsApp: o Asterisk se registra na Z-API como o "telefone" da instância e repassa as
; ligações para o LiveKit (e do LiveKit para a Z-API). Gerado pelo iniciar.sh a partir do .env.

[global]
type = global
user_agent = ProspectTeam-PonteWhatsApp
; O LiveKit se identifica pelo usuário da autenticação (o IP dele muda).
endpoint_identifier_order = ip,auth_username,username

[transporte-udp]
type = transport
protocol = udp
bind = 0.0.0.0:5060
external_media_address = ${IP_PUBLICO}
external_signaling_address = ${IP_PUBLICO}

; ───────────── Z-API (o WhatsApp) ─────────────
[zapi-auth]
type = auth
auth_type = userpass
username = ${ZAPI_INSTANCIA}
password = ${ZAPI_SIP_TOKEN}

[zapi-registro]
type = registration
transport = transporte-udp
outbound_auth = zapi-auth
server_uri = sip:sip.z-api.io
client_uri = sip:${ZAPI_INSTANCIA}@sip.z-api.io
contact_user = ${ZAPI_INSTANCIA}
expiration = 300
retry_interval = 30
forbidden_retry_interval = 300
max_retries = 10000
line = yes
endpoint = zapi

[zapi]
type = aor
contact = sip:sip.z-api.io
; A Z-API não responde ao OPTIONS: sem "qualify", o contato vale sempre.
qualify_frequency = 0

[zapi]
type = endpoint
transport = transporte-udp
context = do-whatsapp
aors = zapi
outbound_auth = zapi-auth
from_user = ${ZAPI_INSTANCIA}
from_domain = sip.z-api.io
disallow = all
allow = opus,ulaw,alaw
dtmf_mode = auto
direct_media = no
rtp_symmetric = yes
force_rport = yes
rewrite_contact = yes

[zapi-identify]
type = identify
endpoint = zapi
match = sip.z-api.io

; ───────────── LiveKit (a telefonia do Prospect Team) ─────────────
; Entrada (WhatsApp → CRM): o Asterisk liga para o SIP do LiveKit (tronco de entrada liberado
; para o IP desta máquina). Saída (CRM → WhatsApp): o tronco de saída do LiveKit liga para cá com
; o usuário e a senha abaixo.
[livekit-entrada-auth]
type = auth
auth_type = userpass
username = ${SAIDA_USUARIO}
password = ${SAIDA_SENHA}

[livekit]
type = aor
contact = sip:${LIVEKIT_SIP_HOST}

[livekit]
type = endpoint
transport = transporte-udp
context = do-livekit
aors = livekit
auth = livekit-entrada-auth
disallow = all
allow = opus,ulaw,alaw
dtmf_mode = rfc4733
direct_media = no
rtp_symmetric = yes
force_rport = yes
rewrite_contact = yes
