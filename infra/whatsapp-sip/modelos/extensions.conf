; Plano de discagem da ponte do WhatsApp. Gerado pelo iniciar.sh a partir do .env.
[general]
static = yes
writeprotect = yes

[globals]
NUMERO_WHATSAPP = ${NUMERO_WHATSAPP}

; Alguém ligou no WhatsApp da conta: vai para o LiveKit com o número do WhatsApp como destino
; (o CRM reconhece a conta por ele) e o número de quem ligou como origem.
[do-whatsapp]
exten => _[0-9A-Za-z+*#].,1,Goto(do-whatsapp,s,1)
exten => s,1,NoOp(WhatsApp de ${CALLERID(num)} para ${GLOBAL(NUMERO_WHATSAPP)})
 same => n,Set(QUEM=${FILTER(0-9,${CALLERID(num)})})
 same => n,Set(CALLERID(num)=+${IF($[${LEN(${QUEM})} <= 11]?55)}${QUEM})
 same => n,Dial(PJSIP/${GLOBAL(NUMERO_WHATSAPP)}@livekit,90)
 same => n,Hangup()

; O vendedor ligou pelo WhatsApp no CRM: o LiveKit manda o número do lead (+55…); sai pela Z-API.
[do-livekit]
exten => _+X.,1,Goto(do-livekit,${EXTEN:1},1)
exten => _X.,1,NoOp(CRM ligando pelo WhatsApp para ${EXTEN})
 same => n,Set(DESTINO=${IF($[${LEN(${EXTEN})} <= 11]?55)}${EXTEN})
 same => n,Dial(PJSIP/${DESTINO}@zapi,60)
 same => n,Hangup()
