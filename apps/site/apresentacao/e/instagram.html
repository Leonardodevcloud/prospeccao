<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prospect Team · animação</title>
<meta name="robots" content="noindex">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:transparent;overflow:hidden;color:#18181b}
#raiz{position:absolute;left:0;top:0;width:900px;height:760px;display:grid;grid-template-columns:400px 1fr;gap:24px}
body.vitrine{background:radial-gradient(circle at 15% 20%,#e2f1ee 0%,#f7f7f5 55%)}
.cartao{background:#fff;border:1px solid #e4e4df;border-radius:24px;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 24px 48px -16px rgba(24,24,27,.22)}
.cab{display:flex;align-items:center;gap:12px;padding:14px 18px}
.av{width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,#0b6b63,#3cc4b3);color:#fff;display:grid;place-items:center;font-weight:700;font-size:18px}
.cab b{font-size:20px}.cab span{font-size:16px;color:#5b5b56;display:block}
.foto{height:300px;background:linear-gradient(150deg,#0b6b63 0%,#0e4f4a 55%,#12302c 100%);color:#fff;padding:28px;display:flex;flex-direction:column;justify-content:flex-end;gap:10px;position:relative}
.foto i{position:absolute;right:26px;top:24px;font-style:normal;font-size:16px;background:rgba(255,255,255,.16);border-radius:999px;padding:6px 12px}
.foto h4{font-size:34px;line-height:1.08;letter-spacing:-.5px}
.foto p{font-size:18px;color:#bfe6df}
.foto p b{color:#fff;background:#3cc4b3;color:#0a1f1c;border-radius:6px;padding:1px 8px}
.acoes{display:flex;gap:18px;padding:14px 18px 4px}
.acoes svg{width:28px;height:28px;stroke:#18181b;fill:none;stroke-width:2}
.acoes svg.c{stroke:#d92d20;fill:#d92d20}
.curt{font-size:17px;font-weight:600;padding:2px 18px 8px}
.coms{flex:1;display:flex;flex-direction:column;justify-content:flex-end;gap:10px;padding:6px 18px 18px;overflow:hidden}
.com{display:flex;align-items:center;gap:10px;font-size:18px;animation:in .4s ease-out}
.com .a{width:30px;height:30px;border-radius:50%;flex:none;display:grid;place-items:center;font-size:13px;font-weight:700;color:#fff}
.com b{font-weight:600}
.com em{margin-left:auto;font-style:normal;font-size:14px;font-weight:600;color:#0b6b63;background:#e2f1ee;border-radius:999px;padding:4px 10px;white-space:nowrap;opacity:0;transition:opacity .4s}
.com em.on{opacity:1}
.dm{background:#efeee9;border:1px solid #e4e4df;border-radius:24px;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 24px 48px -16px rgba(24,24,27,.22)}
.dm .cab{background:#fff;border-bottom:1px solid #e4e4df}
.tag{margin-left:auto;font-size:15px;font-weight:600;color:#0b6b63;background:#e2f1ee;border-radius:999px;padding:5px 12px;display:flex;align-items:center;gap:8px}
.tag i{width:9px;height:9px;border-radius:50%;background:#0b6b63;animation:p 1.2s infinite}
@keyframes p{50%{opacity:.25}}
.msgs{flex:1;display:flex;flex-direction:column;justify-content:flex-end;gap:12px;padding:18px;overflow:hidden}
.b{max-width:86%;font-size:18px;line-height:1.4;padding:12px 16px;border-radius:16px;animation:in .35s ease-out}
.b small{display:block;font-size:13px;opacity:.7;margin-top:4px;text-align:right}
.eu{align-self:flex-end;background:#d9efe9;border-bottom-right-radius:4px}
.ele{align-self:flex-start;background:#fff;border-bottom-left-radius:4px}
.rot{font-size:14px;font-weight:700;color:#0b6b63;margin-bottom:3px}
.bt{display:block;margin-top:10px;text-align:center;font-weight:600;font-size:16px;background:#fff;border:1px solid #b9ddd6;border-radius:10px;padding:8px}
.dig{align-self:flex-start;background:#fff;border-radius:16px;padding:14px 18px;display:flex;gap:7px}
.dig.eu{align-self:flex-end;background:#d9efe9}
.dig i{width:10px;height:10px;border-radius:50%;background:#8a8a83;animation:d 1s infinite}
.dig i:nth-child(2){animation-delay:.15s}.dig i:nth-child(3){animation-delay:.3s}
@keyframes d{50%{transform:translateY(-5px);opacity:.4}}
.chip{align-self:center;display:flex;align-items:center;gap:10px;background:#0b6b63;color:#fff;font-size:18px;font-weight:600;border-radius:999px;padding:12px 22px;animation:in .4s ease-out;box-shadow:0 12px 24px -10px #0b6b63}
.vazio{margin:auto;text-align:center;color:#5b5b56;font-size:18px;line-height:1.5}
@keyframes in{from{opacity:0;transform:translateY(12px)}}
</style>
</head>
<body>
<div id="raiz">
<div class="cartao">
<div class="cab"><div class="av">N</div><div><b>nexosistemas</b><span>Salvador, BA</span></div></div>
<div class="foto"><i>carrossel 1/8</i><h4>Checklist de prospecção B2B: 12 passos</h4><p>Comente <b>QUERO</b> que eu te mando no direct</p></div>
<div class="acoes"><svg class="c" viewBox="0 0 24 24"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/></svg><svg viewBox="0 0 24 24"><path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z"/></svg><svg viewBox="0 0 24 24"><path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/></svg></div>
<p class="curt" id="curt">1.904 curtidas</p>
<div class="coms" id="coms"></div>
</div>
<div class="dm">
<div class="cab"><div class="av" id="dmav" style="background:#7a5af8">?</div><div><b id="dmnome">Direct</b><span id="dmsub">esperando um comentário</span></div><span class="tag"><i></i>Automático</span></div>
<div class="msgs" id="m"><p class="vazio">Quem comentar a palavra recebe<br>a mensagem aqui, na hora.</p></div>
</div>
</div>
<script src="instagram.js"></script>
</body>
</html>
