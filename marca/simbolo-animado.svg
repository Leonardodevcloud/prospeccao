<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -10 64 74" role="img" aria-label="Prospect Team"><title>Prospect Team</title><style>.pt-fig{transform-box:fill-box;transform-origin:50% 100%;animation:pt-pulo 680ms cubic-bezier(.3,.7,.3,1) 300ms both}.pt-2{animation-delay:410ms}.pt-3{animation-delay:520ms}svg:hover .pt-fig{animation-name:pt-pulo2;animation-delay:0ms}svg:hover .pt-2{animation-delay:110ms}svg:hover .pt-3{animation-delay:220ms}@keyframes pt-pulo{15%{transform:scale(1.04,.9)}45%{transform:translateY(-9px) scale(.97,1.05)}70%{transform:scale(1.05,.92)}85%{transform:scale(.99,1.02)}}@keyframes pt-pulo2{15%{transform:scale(1.04,.9)}45%{transform:translateY(-9px) scale(.97,1.05)}70%{transform:scale(1.05,.92)}85%{transform:scale(.99,1.02)}}@media (prefers-reduced-motion:reduce){svg .pt-fig,svg:hover .pt-fig{animation:none}}</style><g class="pt-fig pt-1"><rect x="7" y="35" width="13" height="22" rx="6.5" fill="#18181b"/><circle cx="13.5" cy="26" r="6" fill="#18181b"/></g><g class="pt-fig pt-2"><rect x="25.5" y="27" width="13" height="30" rx="6.5" fill="#18181b"/><circle cx="32" cy="18" r="6" fill="#18181b"/></g><g class="pt-fig pt-3"><rect x="44" y="19" width="13" height="38" rx="6.5" fill="#0b6b63"/><circle cx="50.5" cy="10" r="6" fill="#0b6b63"/></g></svg>
